<div id="app">
  <div style="padding:40px;font-family:Segoe UI,Arial,sans-serif">
    <h2>CalcIndep</h2>
    <p id="ci-carga">Cargando el programa…</p>
    <noscript><p>Este programa necesita JavaScript.</p></noscript>
  </div>
</div>
<script>
  // Comprobación de compatibilidad antes de cargar el resto (Chrome 80+, Edge 80+, Firefox 90+).
  (function () {
    var falta = [];
    try { new Function("class A { #x = 1; static y = 2; }; let a = 1 ?? 2; let b = ({})?.c; return 1n;"); } catch (e) { falta.push("JavaScript moderno (ES2020)"); }
    if (typeof Worker === "undefined") falta.push("Web Workers");
    if (typeof indexedDB === "undefined") falta.push("IndexedDB");
    if (typeof MessageChannel === "undefined") falta.push("MessageChannel");
    if (typeof Blob === "undefined" || typeof URL === "undefined" || !URL.createObjectURL) falta.push("Blob/URL");
    if (falta.length) {
      window.CI_INCOMPATIBLE = true;
      document.getElementById("ci-carga").innerHTML = "Este navegador no es compatible con CalcIndep (falta: " + falta.join(", ") +
        ").<br>Use Chrome 109 o posterior, Edge o Firefox 115 o posterior.";
    }
  })();
</script>

<script>
  if (!window.CI_INCOMPATIBLE) {
    if (typeof CIApp === "undefined") {
      document.getElementById("ci-carga").textContent = "No se han podido cargar los ficheros del programa. Compruebe que la carpeta «js» está junto a CalcIndep.html.";
    } else {
      CIApp.start().catch(function (e) { console.error(e); alert("Error al iniciar CalcIndep: " + (e && e.message || e)); });

  }
